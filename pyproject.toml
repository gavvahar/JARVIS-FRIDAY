# =============================================================================
# GIT-CLIFF — PR description generator
# =============================================================================

[tool.git-cliff.changelog]
header = ""
body = """
## Summary
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}

## Test plan

- [ ] Review the changes above
- [ ] Existing tests pass
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "✨ Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^chore", group = "🔧 Chores" },
  { message = "^lint", group = "🔧 Chores" },
  { message = ".*", group = "📝 Changes" },
]

# =============================================================================
# RUFF — Python linter & formatter
# =============================================================================

[tool.ruff]
line-length = 180
exclude = ["__pycache__", "venv", ".tox", ".venv", "tests.py", "env"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E203", "E501", "E701", "E401", "B008"]


# =============================================================================
# TOX — Test & task runner
# =============================================================================

# Default envs run when you type `tox` with no arguments
[tool.tox]
env_list = [
  "lint",
  "txt-lint",
  "format",
  "prettier",
  "toml-lint",
  "duplicate-code",
]
work_dir = "/tmp/.tox"

# Shared base config inherited by all envs
[tool.tox.env_run_base]
# GH_TOKEN/GITHUB_TOKEN: needed by the zizmor env, and must be listed here
# (not just on that env) so it survives nested `tox -e X` calls (github ->
# zizmor, all -> github -> zizmor) — each level only inherits what the level
# above already had in pass_env, it doesn't re-consult the original shell env.
pass_env = ["PATH", "GH_TOKEN", "GITHUB_TOKEN"]
set_env = { VIRTUALENV_OVERRIDE_APP_DATA = "{work_dir}/.virtualenv", PRETTIER_GLOB = "**/*.{css,js,html,json,yml,yaml,md}" }

# --- Linting ----------------------------------------------------------------

[tool.tox.env.lint]
skip_install = true
base_python = "python3"
deps = ["ruff"]
commands = [["ruff", "check", "--no-cache", "."]]

[tool.tox.env."txt-lint"]
skip_install = true
allowlist_externals = ["npx", "npm"]
commands = [
  [
    "npm",
    "install",
    "--save-dev",
    "textlint",
    "textlint-rule-common-misspellings",
    "textlint-rule-write-good",
  ],
  [
    "npx",
    "textlint",
    "--rule",
    "common-misspellings",
    "--rule",
    "write-good",
    "**/*.txt",
  ],
]

[tool.tox.env."combined-imports-check"]
skip_install = true
deps = []
commands = [["python3", "scripts/combined_imports_check.py"]]

[tool.tox.env."no-classes-check"]
skip_install = true
deps = []
commands = [["python3", "scripts/no_classes_check.py"]]

# --- Formatting -------------------------------------------------------------

[tool.tox.env.format]
skip_install = true
deps = ["ruff", "ty"]
allowlist_externals = ["npx"]
commands = [
  [
    "python3",
    "scripts/combined_imports_check.py",
    "--fix",
  ],
  [
    "ruff",
    "format",
    "--no-cache",
    "--verbose",
    ".",
  ],
  [
    "ruff",
    "check",
    "--no-cache",
    "--fix",
    "--verbose",
    ".",
  ],
  [
    "npx",
    "prettier",
    "--write",
    "--log-level",
    "log",
    "{env:PRETTIER_GLOB}",
  ],
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--no-auto-config",
    "**/*.toml",
  ],
]

[tool.tox.env.scss]
skip_install = true
allowlist_externals = ["npx"]
commands = [["npx", "sass", "--no-source-map", "static/scss:static/css"]]

[tool.tox.env.prettier]
skip_install = true
allowlist_externals = ["npx"]
commands = [["npx", "prettier", "--check", "{env:PRETTIER_GLOB}"]]

[tool.tox.env."toml-lint"]
skip_install = true
allowlist_externals = ["npx"]
commands = [
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--check",
    "--no-auto-config",
    "**/*.toml",
  ],
  [
    "npx",
    "@taplo/cli",
    "lint",
    "--no-auto-config",
    "**/*.toml",
  ],
]

# --- Duplication --------------------------------------------------------

# Zero-tolerance duplicate-code check (jscpd, config in .jscpd.json). Real
# duplication found should be refactored into a shared file the callers
# source/import, not waved off by raising the threshold.
[tool.tox.env."duplicate-code"]
skip_install = true
allowlist_externals = ["npx", "npm"]
commands = [["npm", "install", "--save-dev", "jscpd"], ["npx", "jscpd", "."]]

# --- Security -----------------------------------------------------------

[tool.tox.env."secret-detection"]
skip_install = true
allowlist_externals = ["sh", ".bin/trufflehog"]
commands = [
  [
    "sh",
    "-c",
    "curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b .bin",
  ],
  [
    ".bin/trufflehog",
    "git",
    "file://{toxinidir}",
    "--results=verified,unverified,unknown",
    "--fail",
  ],
]

# Static analysis of GitHub Actions workflows (unpinned actions, template
# injection, credential persistence, excessive permissions, etc). Picks up
# GH_TOKEN/GITHUB_TOKEN from the environment automatically if set, which
# raises unauthenticated GitHub API rate limits for its online audits. Falls
# back to offline-only audits with a warning if no token is set — use
# zizmor-online instead where you want that to be a hard failure.
[tool.tox.env.zizmor]
skip_install = true
deps = ["zizmor"]
commands = [["zizmor", "."]]

# Same audits as zizmor above, but fails fast if no GitHub token is set
# instead of silently degrading to offline-only audits. Prefers GH_PAT
# (same secrets.GH_PAT || github.token fallback used in cascade-merge.yml)
# since it isn't subject to the default GITHUB_TOKEN's tighter cross-repo
# API limits — zizmor itself only reads GH_TOKEN/GITHUB_TOKEN, not GH_PAT,
# so it's passed through as GH_TOKEN. Use this where a token is expected
# to be present (e.g. CI) and you want to be sure the online audits (which
# need GitHub API access) actually ran.
[tool.tox.env."zizmor-online"]
skip_install = true
allowlist_externals = ["sh"]
deps = ["zizmor"]
pass_env = ["PATH", "GH_PAT", "GH_TOKEN", "GITHUB_TOKEN"]
commands = [
  [
    "sh",
    "-c",
    "TOKEN=$GH_PAT; if [ -z \"$TOKEN\" ]; then TOKEN=$GH_TOKEN; fi; if [ -z \"$TOKEN\" ]; then TOKEN=$GITHUB_TOKEN; fi; if [ -z \"$TOKEN\" ]; then echo 'zizmor-online requires GH_PAT, GH_TOKEN, or GITHUB_TOKEN to be set' >&2; exit 1; fi; GH_TOKEN=$TOKEN zizmor .",
  ],
]

# --- Aggregate (CI) ---------------------------------------------------------

# Runs the full CI chain: no-classes-check → lint → txt-lint → prettier →
# toml-lint → combined-imports-check → secret-detection → duplicate-code → zizmor
[tool.tox.env.github]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [
  [
    "tox",
    "-e",
    "no-classes-check",
  ],
  [
    "tox",
    "-e",
    "lint",
  ],
  [
    "tox",
    "-e",
    "txt-lint",
  ],
  [
    "tox",
    "-e",
    "prettier",
  ],
  [
    "tox",
    "-e",
    "toml-lint",
  ],
  [
    "tox",
    "-e",
    "combined-imports-check",
  ],
  [
    "tox",
    "-e",
    "secret-detection",
  ],
  [
    "tox",
    "-e",
    "duplicate-code",
  ],
  [
    "tox",
    "-e",
    "zizmor",
  ],
]

# Runs format then the full github chain
[tool.tox.env.all]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [["tox", "-e", "format"], ["tox", "-e", "github"]]
