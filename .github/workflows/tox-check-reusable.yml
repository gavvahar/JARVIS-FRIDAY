name: Tox check (reusable)

on:
  workflow_call:
    inputs:
      tox_env:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run tox (${{ inputs.tox_env }})
        env:
          INPUTS_TOX_ENV: ${{ inputs.tox_env }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: tox -e "${INPUTS_TOX_ENV}"
